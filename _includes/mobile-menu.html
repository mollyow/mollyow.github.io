<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.querySelector('.mobile-menu-toggle');
    const menu = document.getElementById('mobile-menu');
    if (!menuToggle || !menu) return;

    const closeButton = menu.querySelector('.mobile-menu-close');
    const mobileViewport = window.matchMedia('(max-width: 600px)');
    let previousOverflow = '';

    function closeMenu() {
        if (menu.open) menu.close();
    }

    menuToggle.addEventListener('click', function() {
        if (!mobileViewport.matches || menu.open) return;
        previousOverflow = document.body.style.overflow;
        menu.showModal();
        document.body.style.overflow = 'hidden';
        menuToggle.setAttribute('aria-expanded', 'true');
        closeButton.focus();
    });

    closeButton.addEventListener('click', closeMenu);
    menu.addEventListener('cancel', function(event) {
        event.preventDefault();
        closeMenu();
    });
    menu.addEventListener('close', function() {
        document.body.style.overflow = previousOverflow;
        menuToggle.setAttribute('aria-expanded', 'false');
        const returnTarget = mobileViewport.matches
            ? menuToggle
            : document.querySelector('.site-title');
        returnTarget.focus();
    });

    // The native modal dialog makes the page behind the menu inert.
    menu.addEventListener('keydown', function(event) {
        if (event.key !== 'Tab') return;
        const controls = menu.querySelectorAll('a[href], button:not([disabled])');
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    });

    menu.querySelectorAll('.mobile-nav a').forEach(function(link) {
        link.addEventListener('click', closeMenu);
    });
    menu.addEventListener('click', function(event) {
        if (event.target === menu) closeMenu();
    });
    mobileViewport.addEventListener('change', function(event) {
        if (!event.matches) closeMenu();
    });
});
</script>
